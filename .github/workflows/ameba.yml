name: Ameba

on:
  workflow_call:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v7

      - name: Run Ameba Linter
        uses: crystal-ameba/github-action@master
